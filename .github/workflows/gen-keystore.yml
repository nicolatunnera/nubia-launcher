name: Gen Keystore (usa e getta)
on:
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Genera keystore di firma stabile
        run: |
          keytool -genkeypair -v \
            -keystore keystore.jks \
            -alias launcher -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Launcher2026! -keypass Launcher2026! \
            -dname "CN=Nubia Launcher, OU=Dev, O=Personal, L=Home, ST=Home, C=IT"
      - uses: actions/upload-artifact@v5
        with:
          name: keystore
          path: keystore.jks
